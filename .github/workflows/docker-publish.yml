name: CI / Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: contbak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION ($expected)." >&2
            exit 1
          fi

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/main.py
          for patch in app/patch_restore_*.py; do
            [ -e "$patch" ] || continue
            python -m py_compile "$patch"
          done

      - name: Build validation image
        run: docker build --pull --tag contbak:ci .

      - name: Start application smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/contbak-ci/config" "$RUNNER_TEMP/contbak-ci/backups"
          docker run -d --name contbak-ci \
            -p 18080:8080 \
            -e TZ=UTC \
            -e CONTBAK_USER=ci \
            -e CONTBAK_PASSWORD=ci-test-password \
            -v "$RUNNER_TEMP/contbak-ci/config:/data" \
            -v "$RUNNER_TEMP/contbak-ci/backups:/backups" \
            contbak:ci

      - name: Verify health and running version
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '\r\n' < VERSION)"
          for attempt in $(seq 1 30); do
            if response="$(curl --fail --silent http://127.0.0.1:18080/health 2>/dev/null)"; then
              echo "$response"
              python - "$expected" "$response" <<'PY'
import json, sys
expected, payload = sys.argv[1], json.loads(sys.argv[2])
assert payload.get('status') == 'ok', payload
assert payload.get('version') == expected, (payload, expected)
PY
              exit 0
            fi
            if ! docker ps -a --format '{{.Names}}' | grep -qx contbak-ci; then
              echo 'Smoke-test container disappeared.' >&2
              exit 1
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' contbak-ci 2>/dev/null || true)" != "true" ]; then
              echo 'Smoke-test container stopped unexpectedly.' >&2
              docker logs contbak-ci >&2 || true
              exit 1
            fi
            sleep 2
          done
          echo 'ContBak did not become healthy within 60 seconds.' >&2
          docker logs contbak-ci >&2 || true
          exit 1

      - name: Show application logs on failure
        if: failure()
        run: docker logs contbak-ci || true

      - name: Cleanup smoke test
        if: always()
        run: docker rm -f contbak-ci >/dev/null 2>&1 || true

  cleanup-history:
    name: Clean old failed main runs
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove superseded failed main runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current="$GITHUB_RUN_ID"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=main&status=failure&per_page=100" \
            --jq '.workflow_runs[].id' | while read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" = "$current" ] && continue
              echo "Deleting superseded failed workflow run $run_id"
              gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id"
            done

  publish:
    name: Publish
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: frazon11/contbak
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "ContBak $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
